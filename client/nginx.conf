server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }

    # Vite emits content-hashed filenames under /assets, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # "server" resolves to the backend service on the compose network.
    location /api/ {
        proxy_pass http://server:8000;

        # Saving a report uploads the generated workbook. The annual utilization
        # export carries a year of raw time entries and passes nginx's 1MB
        # default easily; the failure surfaced as a bare 413 with nothing in the
        # server log.
        client_max_body_size 100M;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE log streams must not be buffered, and a report can run for minutes.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
