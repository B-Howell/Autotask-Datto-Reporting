# Run the stack on generated demo data with no vendor accounts:
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build
#
# The server seeds its cache before serving, so each start takes about a
# minute while the generators run.
services:
  server:
    environment:
      DEMO_MODE: "1"
      # Schedules are shown in this zone; change it to yours.
      SCHEDULE_TIMEZONE: America/New_York
    command: ["sh", "-c", "python -m demo.seed && uvicorn main:app --host 0.0.0.0 --port 8000"]
